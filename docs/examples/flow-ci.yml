# Example only: approve its digest in RemoteCI before using it on a task PR.
# Keep the task specification in flow-spec.json, with its original base SHA.
# This inline producer is covered by trusted_workflow_digest.
name: Flow evidence
on: [pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.11
      - run: uv sync --frozen
      - run: uv run --frozen python -m unittest discover -s tests -v
      - name: Record checkout and immutable task-policy identity
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          def digest(value):
              return hashlib.sha256(json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()).hexdigest()
          spec = json.loads(pathlib.Path('flow-spec.json').read_text())
          tested = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert tested == os.environ['HEAD_SHA']
          assert spec['task']['base_sha'] == os.environ['BASE_SHA']
          evidence = dict(head_sha=os.environ['HEAD_SHA'], base_sha=os.environ['BASE_SHA'], tested_sha=tested,
                          task_digest=digest(spec['task']), policy_digest=digest(spec['policy']), run_id=int(os.environ['GITHUB_RUN_ID']))
          pathlib.Path('evidence.json').write_text(json.dumps(evidence))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-company-evidence
          path: evidence.json
          if-no-files-found: error
