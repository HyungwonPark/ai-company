[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-company"
version = "0.1.0.dev0"
description = "Shared agent harness and a recoverable development loop"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4", "langsmith>=0.12,<1", "pydantic>=2,<3"]

[project.scripts]
ai-company = "ai_company.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_company"]
