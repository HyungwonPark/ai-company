name: Android runtime
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android-runtime.yml']
  workflow_dispatch:
    inputs:
      apk_tag:
        description: Signed APK release to test
        required: true
        default: android-v0.1.0

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APK_TAG: ${{ inputs.apk_tag || 'android-v0.1.0' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Download the actual signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/android-runtime"
          gh release download "$APK_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'ai-company-*.apk' --pattern SHA256SUMS --dir "$RUNNER_TEMP/android-runtime"
          cd "$RUNNER_TEMP/android-runtime"
          sha256sum --check SHA256SUMS
      - name: Prepare an Android 36 device with Chrome
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' 'system-images;android-36;google_apis_playstore;x86_64' > "$RUNNER_TEMP/android-runtime/sdk-install.log"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name ai-company-runtime --package 'system-images;android-36;google_apis_playstore;x86_64' --device pixel_6
          id
          ls -l /dev/kvm
          # Use the existing device group for this emulator process only. Do not
          # change /dev/kvm permissions, udev rules, or persistent group membership.
          sudo -n setpriv --reuid "$(id -u)" --regid kvm --init-groups --reset-env --no-new-privs "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Install and launch the real signed APK
        run: |
          sudo -n setpriv --reuid "$(id -u)" --regid kvm --init-groups --reset-env --no-new-privs "$ANDROID_HOME/emulator/emulator" -avd ai-company-runtime -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader > "$RUNNER_TEMP/android-runtime/emulator.log" 2>&1 &
          EMULATOR_PID=$!
          trap 'adb emu kill >/dev/null 2>&1 || true; kill "$EMULATOR_PID" 2>/dev/null || true' EXIT
          python3 android/runtime_smoke.py --directory "$RUNNER_TEMP/android-runtime"
      - name: Preserve Android runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/android-runtime/*.json
            ${{ runner.temp }}/android-runtime/*.txt
            ${{ runner.temp }}/android-runtime/*.log
            ${{ runner.temp }}/android-runtime/*.png
          if-no-files-found: error
          retention-days: 14
