name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: unit (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.12.11
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Check workflow and recovery behavior
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Run simulated rejection and repair
        run: uv run --frozen ai-company demo --task examples/demo-task.json --state-dir "$RUNNER_TEMP/ai-company-demo"
