name: Deployed console connectivity

on:
  pull_request:
    paths:
      - 'deploy/console/**'
      - '.github/workflows/public-console.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-https:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Read deployed HTTPS endpoints without authentication or writes
        run: python deploy/console/verify_public.py
