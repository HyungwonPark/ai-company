name: Console UI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.12.11
          uv sync --frozen
      - name: Prepare browser test tooling
        run: |
          node --check src/ai_company/web/app.js
          node --check src/ai_company/web/theme.js
          node --check src/ai_company/web/sw.js
          node --check src/ai_company/web/collaboration-ui.js
          node --check src/ai_company/web/documents-ui.js
          node --check src/ai_company/web/plan-ui.js
          node --check src/ai_company/web/report-ui.js
          node --check src/ai_company/web/manager-ui.js
          node --check src/ai_company/web/diagram-view.js
          node tests/ui/state_checks.mjs
          node tests/ui/manager_checks.mjs
          node tests/ui/workspace_model.cjs
          node tests/ui/workspace_graph_checks.mjs
          node tests/ui/graph_routing_checks.mjs
          npm install --prefix "$RUNNER_TEMP/ui-tooling" --no-audit --no-fund @playwright/test@1.63.0
          google-chrome --version
      - name: Prepare Korean fonts without system installation
        run: |
          mkdir -p "$RUNNER_TEMP/ui-fonts" "$HOME/.local/share/fonts"
          cd "$RUNNER_TEMP/ui-fonts"
          apt-get download fonts-noto-cjk
          for font_package in ./*.deb; do
            dpkg-deb -x "$font_package" extracted
          done
          cp extracted/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc "$HOME/.local/share/fonts/"
          fc-cache -f "$HOME/.local/share/fonts"
          fc-match 'sans:lang=ko'
      - name: Review task-first design preview
        if: always()
        env:
          CHROME_CHANNEL: chrome
          NODE_PATH: ${{ runner.temp }}/ui-tooling/node_modules
          UI_OUTPUT: ${{ runner.temp }}/ui-artifacts
        run: node tests/ui/task_workspace.cjs
      - name: Independently review task-first design
        if: always()
        env:
          CHROME_CHANNEL: chrome
          NODE_PATH: ${{ runner.temp }}/ui-tooling/node_modules
          UI_OUTPUT: ${{ runner.temp }}/ui-artifacts
        run: node tests/ui/task_workspace_independent.cjs
      - name: Verify PR23 R1–R5 preview flow
        if: always()
        env:
          CHROME_CHANNEL: chrome
          NODE_PATH: ${{ runner.temp }}/ui-tooling/node_modules
          UI_OUTPUT: ${{ runner.temp }}/ui-artifacts
        run: node tests/ui/task_workspace_review.cjs
      - name: Compare and independently inspect integrated edge routing
        if: always()
        env:
          CHROME_CHANNEL: chrome
          NODE_PATH: ${{ runner.temp }}/ui-tooling/node_modules
          UI_OUTPUT: ${{ runner.temp }}/ui-artifacts
        run: |
          node tests/ui/graph_drag_stability.cjs
          node tests/ui/graph_edge_comparison.cjs
          uv run --frozen python tests/ui/run_workspace_graph.py --scenario graph_edges_independent.cjs
          uv run --frozen python tests/ui/run_workspace_graph.py --scenario graph_edge_records.cjs
      - name: Review default mobile entry through isolated API
        if: always()
        env:
          CHROME_CHANNEL: chrome
          NODE_PATH: ${{ runner.temp }}/ui-tooling/node_modules
          UI_OUTPUT: ${{ runner.temp }}/ui-artifacts
        run: uv run --frozen python tests/ui/run_workspace_graph.py --scenario mobile_entry.cjs
      - name: Test persistent console with sandboxed Chrome
        env:
          CHROME_CHANNEL: chrome
          NODE_PATH: ${{ runner.temp }}/ui-tooling/node_modules
          UI_OUTPUT: ${{ runner.temp }}/ui-artifacts
        run: uv run --frozen python tests/ui/run_smoke.py
      - name: Test PR12 independent browser failure scenarios
        if: always()
        env:
          CHROME_CHANNEL: chrome
          NODE_PATH: ${{ runner.temp }}/ui-tooling/node_modules
          UI_OUTPUT: ${{ runner.temp }}/ui-artifacts
        run: node tests/ui/pr12_regressions.cjs
      - name: Review alternative workspace designs in sandboxed Chrome
        if: always()
        env:
          CHROME_CHANNEL: chrome
          NODE_PATH: ${{ runner.temp }}/ui-tooling/node_modules
          UI_OUTPUT: ${{ runner.temp }}/ui-artifacts
        run: |
          node tests/ui/workspace_preview.cjs
          node tests/ui/workspace_baseline.cjs
      - name: Independently review workspace interactions
        if: always()
        env:
          CHROME_CHANNEL: chrome
          NODE_PATH: ${{ runner.temp }}/ui-tooling/node_modules
          UI_OUTPUT: ${{ runner.temp }}/ui-artifacts
        run: node tests/ui/workspace_independent.cjs
      - name: Review integrated graph through real read API
        if: always()
        env:
          CHROME_CHANNEL: chrome
          NODE_PATH: ${{ runner.temp }}/ui-tooling/node_modules
          UI_OUTPUT: ${{ runner.temp }}/ui-artifacts
        run: |
          uv run --frozen python tests/ui/run_workspace_graph.py
          node tests/ui/graph_preview.cjs
      - name: Independently test integrated graph interactions
        if: always()
        env:
          CHROME_CHANNEL: chrome
          NODE_PATH: ${{ runner.temp }}/ui-tooling/node_modules
          UI_OUTPUT: ${{ runner.temp }}/ui-artifacts
        run: uv run --frozen python tests/ui/run_workspace_graph.py --scenario workspace_graph_independent.cjs
      - name: Package offline working preview
        if: always()
        run: |
          python scripts/package_workspace_preview.py "$RUNNER_TEMP/workspace-preview/AI-Company-preview.html"
          python scripts/package_task_workspace.py "$RUNNER_TEMP/workspace-preview/AI-Company-task-workspace.html"
          python scripts/package_graph_preview.py "$RUNNER_TEMP/workspace-preview/AI-Company-graph.html"
      - name: Test frozen diagrams through authenticated API
        if: always()
        env:
          CHROME_CHANNEL: chrome
          NODE_PATH: ${{ runner.temp }}/ui-tooling/node_modules
          UI_OUTPUT: ${{ runner.temp }}/ui-artifacts
        run: |
          uv run --frozen python tests/ui/run_workspace_graph.py --scenario diagram_view.cjs
          uv run --frozen python tests/ui/run_workspace_graph.py --scenario diagram_independent.cjs
      - name: Save offline preview
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workspace-preview
          path: ${{ runner.temp }}/workspace-preview/*.html
          retention-days: 30
      - name: Save nonsecret screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: console-screenshots
          path: |
            ${{ runner.temp }}/ui-artifacts/*.png
            ${{ runner.temp }}/ui-artifacts/workspace*-validation.json
            ${{ runner.temp }}/ui-artifacts/workspace-diagram.html
            ${{ runner.temp }}/ui-artifacts/workspace-diagram.svg
            ${{ runner.temp }}/ui-artifacts/workspace-diagram-receipt.json
            ${{ runner.temp }}/ui-artifacts/diagram-independent-validation.json
            ${{ runner.temp }}/ui-artifacts/task-workspace-independent-validation.json
            ${{ runner.temp }}/ui-artifacts/task-workspace-validation.json
            ${{ runner.temp }}/ui-artifacts/task-workspace-review-validation.json
            ${{ runner.temp }}/ui-artifacts/task-workspace-failure.json
            ${{ runner.temp }}/ui-artifacts/mobile-entry-validation.json
            ${{ runner.temp }}/ui-artifacts/mobile-entry-failure.json
            ${{ runner.temp }}/ui-artifacts/graph-edges-independent-validation.json
            ${{ runner.temp }}/ui-artifacts/graph-edge-records-validation.json
            ${{ runner.temp }}/ui-artifacts/graph-edge-touch-validation.json
            ${{ runner.temp }}/ui-artifacts/graph-edge-records-failure.json
            ${{ runner.temp }}/ui-artifacts/graph-edge-records-failure.svg
          if-no-files-found: ignore
          retention-days: 7
